<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebPro - כניסה למנהל</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            color: #64748b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            text-align: right;
            direction: rtl;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #error {
            color: #dc2626;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>
        WebPro
    </h1>

    <p>
        כניסה למערכת ניהול
    </p>

    <form id="loginForm">

        <input
            type="password"
            id="password"
            placeholder="סיסמה"
            required
        >

        <button type="submit">
            כניסה
        </button>

    </form>

    <div id="error"></div>

</div>


<script>

const form = document.getElementById("loginForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password = document.getElementById("password").value;

    const formData = new FormData();

    formData.append("password", password);

    try {

        const response = await fetch("/admin/login", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("wrong password");
        }

        sessionStorage.setItem("adminPassword", password);

        window.location.href = "/admin.html";

    } catch (error) {

        document.getElementById("error").textContent =
            "סיסמה שגויה";

    }

});

</script>

</body>

</html>
